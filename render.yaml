services:
  - type: web
    name: trellis-api
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter "@trellis/config" --filter "@trellis/contracts" --filter "@trellis/domain" --filter "@trellis/api" run build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: trellis-planner-prod
      - key: USE_FIREBASE_EMULATOR
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
